name: Build LethalGuard

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --max-workers=2

      - name: Show build output
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs || true
          echo "=== all JARs ==="
          find build -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LethalGuard-JAR
          path: build/libs/
          if-no-files-found: error
